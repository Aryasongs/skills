<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kashi Mascot</title>
<style>
  :root{
    --ink:#1c1330;
    --paper:#f6f2ff;
    --violet:#7c4fe0;
    --violet-deep:#5a2fc9;
    --glow:#c9a8ff;
    --coral:#ff8f6b;
    --line:#2a1b4d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 20% 15%, #2a1b4d 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #3a1f5c 0%, transparent 50%),
      var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:min(94vw, 420px);
    padding:32px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .bubble-wrap{
    min-height:64px;
    width:100%;
    display:flex;
    justify-content:center;
  }
  .bubble{
    max-width:290px;
    background:var(--paper);
    color:var(--ink);
    padding:12px 16px;
    border-radius:18px;
    border-bottom-left-radius:4px;
    font-size:14.5px;
    line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    opacity:0;
    transform:translateY(6px) scale(.96);
    transition:opacity .25s ease, transform .25s ease;
  }
  .bubble.show{opacity:1; transform:translateY(0) scale(1);}

  .mascot-holder{
    position:relative;
    width:170px;
    height:170px;
  }
  .halo{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, transparent 70%);
    opacity:.55;
    filter:blur(2px);
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(.94); opacity:.45;}
    50%{transform:scale(1.05); opacity:.7;}
  }

  .mascot{
    position:relative;
    width:100%;
    height:100%;
    animation:bob 3.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-8px) rotate(-1.5deg);}
  }

  .body{
    position:absolute;
    inset:0;
    border-radius:46% 54% 50% 50% / 55% 55% 45% 45%;
    background:linear-gradient(155deg, var(--violet) 0%, var(--violet-deep) 65%);
    box-shadow: inset -12px -16px 24px rgba(0,0,0,.25), inset 10px 14px 20px rgba(255,255,255,.12);
  }
  .spark{
    position:absolute;
    top:8%;
    right:16%;
    width:14px;
    height:14px;
    background:var(--coral);
    clip-path:polygon(50% 0%, 61% 35%, 100% 50%, 61% 65%, 50% 100%, 39% 65%, 0% 50%, 39% 35%);
    animation:twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.4; transform:scale(.8) rotate(0deg);}
    50%{opacity:1; transform:scale(1.15) rotate(25deg);}
  }

  .face{
    position:absolute;
    top:44%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70%;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .eye{
    width:16px;
    height:20px;
    background:var(--paper);
    border-radius:50%;
    position:relative;
    animation:blink 4.6s infinite;
  }
  .eye::after{
    content:'';
    position:absolute;
    width:7px;
    height:7px;
    background:var(--ink);
    border-radius:50%;
    top:5px;
    left:5px;
    transition:transform .2s ease;
  }
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1);}
    95%{transform:scaleY(.1);}
  }

  .mouth-wrap{
    position:absolute;
    top:64%;
    left:50%;
    transform:translate(-50%,-50%);
    width:34px;
    height:16px;
  }
  .mouth{
    width:100%;
    height:100%;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    transform-origin:top center;
    transition:height .12s ease, border-radius .12s ease, transform .12s ease;
  }

  /* THINKING state */
  .mascot-holder.thinking .mouth{
    height:6px;
    border-radius:6px;
  }
  .mascot-holder.thinking .body{animation:think-sway 1.1s ease-in-out infinite;}
  @keyframes think-sway{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(3deg);}
  }
  .dots{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    gap:5px;
  }
  .mascot-holder.thinking .dots{display:flex;}
  .dots span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--glow);
    animation:dot-pulse 1.1s ease-in-out infinite;
  }
  .dots span:nth-child(2){animation-delay:.15s;}
  .dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dot-pulse{
    0%,100%{opacity:.3; transform:translateY(0);}
    50%{opacity:1; transform:translateY(-5px);}
  }

  /* TALKING state — mouth animates via JS toggling this class */
  .mouth-wrap.open .mouth{
    height:16px;
    border-radius:10px 10px 14px 14px;
    transform:scaleY(1.15);
  }

  .controls{
    width:100%;
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  input[type=text]{
    flex:1;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:var(--paper);
    font-size:14px;
    outline:none;
  }
  input[type=text]::placeholder{color:rgba(246,242,255,.45);}
  input[type=text]:focus{border-color:var(--glow);}
  button.send{
    padding:0 18px;
    border:none;
    border-radius:14px;
    background:var(--coral);
    color:#2a1200;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  button.send:active{transform:scale(.95);}
  button.send:hover{filter:brightness(1.08);}

  .status{
    font-size:11.5px;
    color:rgba(246,242,255,.4);
    letter-spacing:.02em;
    min-height:14px;
  }

  .voice-toggle{
    position:absolute;
    top:10px;
    right:10px;
    background:none;
    border:1px solid rgba(255,255,255,.2);
    color:rgba(246,242,255,.7);
    font-size:11px;
    padding:5px 10px;
    border-radius:100px;
    cursor:pointer;
  }
  .voice-toggle.on{
    background:var(--glow);
    color:var(--ink);
    border-color:var(--glow);
  }
</style>
</head>
<body>

<div class="stage">
  <button class="voice-toggle" id="voiceToggle">voice: off</button>

  <div class="bubble-wrap">
    <div class="bubble" id="bubble">Hi — I'm Kashi. Ask me something.</div>
  </div>

  <div class="mascot-holder" id="mascotHolder">
    <div class="halo"></div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="mascot">
      <div class="body"></div>
      <div class="spark"></div>
      <div class="face">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth-wrap" id="mouthWrap">
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Type a message…" />
    <button class="send" id="sendBtn">Send</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
const holder = document.getElementById('mascotHolder');
const mouthWrap = document.getElementById('mouthWrap');
const bubble = document.getElementById('bubble');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const voiceToggle = document.getElementById('voiceToggle');

let voiceOn = false;
let mouthTimer = null;

voiceToggle.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voiceToggle.classList.toggle('on', voiceOn);
  voiceToggle.textContent = 'voice: ' + (voiceOn ? 'on' : 'off');
});

function showBubble(text){
  bubble.textContent = text;
  bubble.classList.remove('show');
  void bubble.offsetWidth; // restart transition
  bubble.classList.add('show');
}

function setThinking(on){
  holder.classList.toggle('thinking', on);
  statusEl.textContent = on ? 'Kashi is thinking…' : '';
}

function startMouthLoop(){
  let open = false;
  mouthTimer = setInterval(() => {
    open = !open;
    mouthWrap.classList.toggle('open', open);
  }, 140);
}

function stopMouthLoop(){
  clearInterval(mouthTimer);
  mouthWrap.classList.remove('open');
}

// Very small canned "brain" so this works standalone — swap this
// for a real API call in production.
function generateReply(msg){
  const m = msg.toLowerCase();
  if (!msg.trim()) return "Say something and I'll reply!";
  if (m.includes('hello') || m.includes('hi') || m.includes('hey'))
    return "Hey there! What are we building today?";
  if (m.includes('name'))
    return "I'm Kashi — your little AI companion.";
  if (m.includes('kashish'))
    return "Kashish AI is home — this is just my face for it.";
  return "Got it: \"" + msg.trim() + "\" — noted!";
}

function respond(userMsg){
  setThinking(true);
  bubble.classList.remove('show');

  const thinkDelay = 700 + Math.random() * 500;
  setTimeout(() => {
    setThinking(false);
    const reply = generateReply(userMsg);
    showBubble(reply);

    if (voiceOn && 'speechSynthesis' in window){
      const utter = new SpeechSynthesisUtterance(reply);
      utter.rate = 1.02;
      utter.pitch = 1.15;
      utter.onstart = startMouthLoop;
      utter.onend = stopMouthLoop;
      utter.onerror = stopMouthLoop;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    } else {
      // simulate talking without audio so the mascot still animates
      startMouthLoop();
      setTimeout(stopMouthLoop, Math.min(2600, 500 + reply.length * 35));
    }
  }, thinkDelay);
}

sendBtn.addEventListener('click', () => {
  const val = input.value;
  input.value = '';
  respond(val);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});
</script>

</body>
</html>
